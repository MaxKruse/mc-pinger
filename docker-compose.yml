services:
  mc-ping-logger:
    build: .
    container_name: mc-ping-logger
    restart: unless-stopped
    # ICMP ping and tracepath need raw sockets.
    cap_add:
      - NET_RAW
    environment:
      # Minecraft server to test (host, port).
      TARGET_HOST: 169.155.120.31
      TARGET_PORT: "9080"
      # Run a full test cycle every 30 minutes (aligned to :00 and :30).
      INTERVAL_MINUTES: "30"
      # Control host(s) to separate "your network is bad" from "server is bad".
      # Comma-separate for more than one, e.g. "1.1.1.1,8.8.8.8".
      CONTROL_HOSTS: "1.1.1.1"
      CONTROL_PORT: "443"
      # Minecraft protocol version used for the status ping handshake
      # (769 = 1.21.x; the server ignores mismatches for status pings,
      # so this rarely matters).
      # Timezone for the "next cycle" lines in `docker compose logs`
      # (app.log and results.jsonl are always UTC regardless).
      # TZ: "Europe/Berlin"
      # Keep rotated log files for this many days (default 90).
      KEEP_DAYS: "90"
    volumes:
      - ./data:/data
